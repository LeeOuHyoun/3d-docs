<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:widget="http://www.netvibes.com/ns/">
<head>
  <title>Object Info Panel</title>
  <meta name="autoRefresh" content="-1" />
  <link rel="stylesheet" type="text/css" href="../../c/UWA/assets/css/standalone.css" />
  <script type="text/javascript" src="../../AmdLoader/AmdLoader.js"></script>
  <script type="text/javascript" src="../../c/UWA/js/UWA_Standalone_Alone.js"></script>
  <style type="text/css">
    html, body, .moduleWrapper, .moduleContent { height: 100%; margin: 0; }
    .module { width: 100%; height: 100%; margin: 0; }
    .module > .moduleHeader, .moduleFooter { display: none; }
  </style>
  <script type="text/javascript">
    require([
      'UWA/Core',
      'DS/lodash-4.18.1/lodash',
      'DS/CoreEvents/ModelEvents',
      'DS/ENOXTriptych/js/ENOXTriptych',
      'DS/ENOXPageToolBar/js/PageToolBar',
      'DS/DataGridView/DataGridView',
      'DS/TreeModel/TreeDocument',
      'DS/TreeModel/TreeNodeModel',
      'DS/Recipes/objectInfoPanel/objectInfoPanel'
    ], function (UWA, _, ModelEvents, ENOXTriptych, PageToolBar, DataGridView, TreeDocument, TreeNodeModel, objectInfoPanel) {
      const ROWS = [
        { name: 'PRT-0001', type: 'Part', physicalid: '<Part physicalid>' },
        { name: 'user01', type: 'Person', physicalid: '<Person physicalid>' }
      ];

      widget.addEvent('onLoad', function () {
        const modelEvents = new ModelEvents();
        const frame = UWA.createElement('div', { styles: { position: 'relative', height: '100%' } }).inject(widget.body);
        const middle = UWA.createElement('div', { styles: { display: 'flex', flexDirection: 'column', height: '100%' } });
        const right = UWA.createElement('div', { styles: { height: '100%' } });

        new ENOXTriptych().init({
          modelEvents: modelEvents,
          container: frame,
          withtransition: true,
          right: { resizable: true, minWidth: 250, originalSize: 400 }
        }, null, middle, right);

        const info = objectInfoPanel.create({ modelEvents: modelEvents, container: right });

        new PageToolBar({ modelEvents: modelEvents }).render().inject(UWA.createElement('div', { styles: { flex: 'none', height: '40px' } }).inject(middle));

        const treeDocument = new TreeDocument();
        _.forEach(ROWS, function (row) {
          treeDocument.addRoot(new TreeNodeModel({ label: row.name, grid: row }));
        });

        new DataGridView({
          treeDocument: treeDocument,
          columns: [
            { text: '이름', dataIndex: 'tree', width: 160 },
            { text: '타입', dataIndex: 'type', width: 120 },
            {
              text: '정보',
              dataIndex: 'info',
              width: 120,
              typeRepresentation: 'url',
              getCellValue: function () {
                return {
                  label: '정보 보기',
                  func: function (args) {
                    info.show(args.context.nodeModel.options.grid.physicalid);
                  }
                };
              }
            }
          ]
        }).inject(UWA.createElement('div', { styles: { position: 'relative', flex: '1 1 0', minHeight: 0 } }).inject(middle));
      });
    });
  </script>
</head>
<body></body>
</html>
