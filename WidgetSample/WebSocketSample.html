<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:widget="http://www.netvibes.com/ns/">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>WebSocket Sample</title>
  <meta name="author" content="sample" />
  <meta name="description" content="WebSocket sample: connect a widget to an external WebSocket server with the browser WebSocket or the bundled socket.io-client 4.7.4" />
  <meta name="autoRefresh" content="0" />

  <link rel="stylesheet" type="text/css" href="../c/UWA/assets/css/standalone.css" />
  <link rel="stylesheet" type="text/css" href="../Core/wux.css" />
  <script type="text/javascript" src="../AmdLoader/AmdLoader.js"></script>
  <script type="text/javascript" src="../c/UWA/js/UWA_Standalone_Alone.js"></script>

  <widget:preferences>
    <widget:preference name="x3dPlatformId" type="hidden" defaultValue=""></widget:preference>
    <widget:preference name="serverUrl" type="text" label="WebSocket server" defaultValue=""></widget:preference>
    <widget:preference name="client" type="list" label="Client" defaultValue="native">
      <widget:option value="native" label="WebSocket (browser)"></widget:option>
      <widget:option value="socketio" label="socket.io-client 4.7.4"></widget:option>
    </widget:preference>
    <widget:preference name="socketPath" type="text" label="socket.io path" defaultValue="/socket.io"></widget:preference>
    <widget:preference name="passportService" type="text" label="3DPassport service (token)" defaultValue=""></widget:preference>
  </widget:preferences>

  <style type="text/css">
    .ws-page { padding: 12px; font-family: sans-serif; font-size: 13px; }
    .ws-row { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
    .ws-row label { width: 110px; color: #555; }
    .ws-state { font-weight: bold; }
    .ws-log { height: 260px; overflow: auto; border: 1px solid #d1d4d4; padding: 6px; font: 12px monospace; background: #fafafa; white-space: pre-wrap; }
  </style>

  <script type="text/javascript">
  //<![CDATA[
    require([
      'UWA/Core',
      'DS/DSNodeSocketioClient_4.7.4/DSNodeSocketioClient_4.7.4',
      'DS/PlatformAPI/PlatformAPI',
      'DS/WAFData/WAFData',
      'DS/Controls/Button',
      'DS/Controls/LineEditor'
    ], function (UWA, io, PlatformAPI, WAFData, Button, LineEditor) {
      'use strict';

      var MAX_TRIES = 10;
      var logEl;
      var stateEl;

      function log(text) {
        logEl.textContent = new Date().toLocaleTimeString() + '  ' + text + '\n' + logEl.textContent;
      }

      function setState(text) {
        stateEl.textContent = text;
      }

      function row(parent, labelText) {
        var el = UWA.createElement('div', { 'class': 'ws-row' }).inject(parent);
        if (labelText) { UWA.createElement('label', { text: labelText }).inject(el); }
        return el;
      }

      /*
       * [1] 주소: OOTB(NotificationManager, RTDriver) 처럼 http(s):// 를 떼고 wss:// 를 붙입니다.
       *   - 위젯 페이지가 https 이므로 ws:// 는 혼합 콘텐츠로 막힙니다. ws:// 를 직접 적은 경우(로컬 시험)만 그대로 둡니다.
       */
      // #region url
      function toSocketUrl(value) {
        var url = String(value || '').trim().replace(/\/$/, '');
        if (/^wss?:\/\//.test(url)) {
          return url;
        }
        return 'wss://' + url.replace(/^https?:\/\//, '');
      }
      // #endregion url

      /*
       * [2] 인증 토큰: OOTB 는 연결된 뒤 3DPassport 에 "/login?service=<서비스>" 를 WAFData 로 요청해 access_token 을 받고 소켓으로 보냅니다.
       *   - 서비스 이름은 3DNotification 이 'INTF', RTDriver 가 '3DSIM' 입니다. 커스텀 서버용 서비스가 3DPassport 에 있어야 합니다.
       *   - passportService 설정이 비어 있으면 토큰 없이 연결합니다.
       */
      // #region token
      function getAccessToken() {
        var service = String(widget.getValue('passportService') || '').trim();
        if (!service) {
          return Promise.resolve(null);
        }
        var passportUrl = PlatformAPI.getApplicationConfiguration('app.urls.passport');
        if (!passportUrl) {
          return Promise.reject(new Error('app.urls.passport 가 없습니다 (3DDashboard 밖)'));
        }
        return new Promise(function (resolve, reject) {
          WAFData.authenticatedRequest(passportUrl + '/login?service=' + encodeURIComponent(service), {
            type: 'json',
            onComplete: function (data) {
              try {
                var json = typeof data === 'string' ? JSON.parse(data) : data;
                if (json && json.access_token) {
                  resolve(json.access_token);
                } else {
                  reject(new Error('access_token 이 없습니다'));
                }
              } catch (e) {
                reject(e);
              }
            },
            onFailure: reject,
            onPassportError: reject
          });
        });
      }
      // #endregion token

      /*
       * [3] 브라우저 WebSocket: 다시 연결은 직접 만듭니다 (1, 2, 4 ... 최대 30 초 간격, MAX_TRIES 번).
       *   - 메시지는 문자열만 오가므로 { type, data } JSON 으로 주고받습니다. 연결되면 먼저 auth 를 보냅니다.
       */
      // #region native
      function openNative(url, handlers) {
        var socket = null;
        var timer = null;
        var tries = 0;
        var closedByUser = false;

        function connect() {
          socket = new WebSocket(url);
          socket.onopen = function () {
            tries = 0;
            handlers.onOpen();
          };
          socket.onmessage = function (event) {
            handlers.onMessage(event.data);
          };
          socket.onerror = function () {
            handlers.onError('error');
          };
          socket.onclose = function (event) {
            handlers.onClose(event.code + ' ' + (event.reason || ''));
            if (!closedByUser && tries < MAX_TRIES) {
              timer = setTimeout(connect, Math.min(30000, 1000 * Math.pow(2, tries++)));
            }
          };
        }

        connect();
        return {
          isOpen: function () { return socket.readyState === WebSocket.OPEN; },
          send: function (type, data) { socket.send(JSON.stringify({ type: type, data: data })); },
          ensure: function () {
            if (!closedByUser && socket.readyState === WebSocket.CLOSED) {
              clearTimeout(timer);
              tries = 0;
              connect();
            }
          },
          close: function () {
            closedByUser = true;
            clearTimeout(timer);
            socket.close(1000, 'widget closed');
          }
        };
      }
      // #endregion native

      /*
       * [4] socket.io-client 4.7.4 (DS/DSNodeSocketioClient_4.7.4): OOTB 와 같이 transports 를 websocket 하나로 둡니다.
       *   - 다시 연결은 socket.io 가 합니다. 이벤트 이름으로 주고받으므로 JSON 으로 감쌀 필요가 없습니다.
       *   - path 는 서버 설정과 같아야 합니다 (socket.io 기본 '/socket.io', RTDriver 는 '/socketio.rtc').
       */
      // #region socketio
      function openSocketIo(url, handlers) {
        var socket = io(url, {
          path: String(widget.getValue('socketPath') || '/socket.io'),
          transports: ['websocket'],
          reconnection: true,
          reconnectionAttempts: MAX_TRIES,
          reconnectionDelayMax: 30000,
          timeout: 10000
        });
        socket.on('connect', handlers.onOpen);
        socket.on('message', handlers.onMessage);
        socket.on('connect_error', function (error) { handlers.onError(error.message); });
        socket.on('disconnect', handlers.onClose);
        socket.io.on('reconnect_attempt', function (count) { handlers.onError('reconnect_attempt ' + count); });
        return {
          isOpen: function () { return socket.connected; },
          send: function (type, data) { socket.emit(type, data); },
          ensure: function () {
            if (!socket.connected && !socket.active) {
              socket.connect();
            }
          },
          close: function () { socket.disconnect(); }
        };
      }
      // #endregion socketio

      /*
       * [5] 연결, 인증, 정리
       *   - 연결될 때마다(다시 연결 포함) 토큰을 새로 받아 auth 로 보냅니다 (OOTB 의 new_user, login 과 같은 순서).
       *   - 탭이 다시 보이거나 네트워크가 돌아오면 끊긴 연결을 다시 엽니다 (NotificationManager 의 visibilitychange, online).
       *   - 위젯을 지우거나 페이지를 떠날 때 pagehide 에서 닫습니다. 설정을 바꾸면 닫고 다시 엽니다.
       */
      // #region connect
      var client = null;

      function connect() {
        disconnect();
        var serverUrl = widget.getValue('serverUrl');
        if (!serverUrl) {
          log('설정에서 WebSocket server 를 넣습니다.');
          return;
        }
        var url = toSocketUrl(serverUrl);
        var open = widget.getValue('client') === 'socketio' ? openSocketIo : openNative;
        setState('연결 중');
        log('connect ' + url + ' (' + widget.getValue('client') + ')');
        var current = open(url, {
          onOpen: function () {
            setState('연결됨');
            log('open');
            getAccessToken().then(function (token) {
              if (token && client === current) {
                current.send('auth', { token: token, tenant: widget.getValue('x3dPlatformId') });
                log('auth 보냄');
              }
            }, function (error) {
              log('토큰 실패: ' + error.message);
            });
          },
          onMessage: function (data) {
            log('받음 ' + (typeof data === 'string' ? data : JSON.stringify(data)));
          },
          onError: function (text) {
            log(text);
          },
          onClose: function (reason) {
            if (client === current) {
              setState('끊김');
            }
            log('close ' + reason);
          }
        });
        client = current;
      }

      function disconnect() {
        if (client) {
          client.close();
          client = null;
          setState('닫음');
        }
      }

      function ensureConnected() {
        if (client && !document.hidden) {
          client.ensure();
        }
      }

      document.addEventListener('visibilitychange', ensureConnected);
      window.addEventListener('online', ensureConnected);
      window.addEventListener('pagehide', disconnect);
      // #endregion connect

      function build() {
        var page = UWA.createElement('div', { 'class': 'ws-page' });

        stateEl = UWA.createElement('span', { 'class': 'ws-state', text: '닫음' });
        stateEl.inject(row(page, '상태'));

        var actions = row(page);
        new Button({ label: '연결', emphasize: 'primary', onClick: connect }).inject(actions);
        new Button({ label: '끊기', onClick: disconnect }).inject(actions);

        var messageEditor = new LineEditor({ placeholder: '보낼 글', sizeInCharNumber: 36 });
        var sendRow = row(page, '메시지');
        messageEditor.inject(sendRow);
        new Button({ label: '보내기', onClick: onSend }).inject(sendRow);

        logEl = UWA.createElement('div', { 'class': 'ws-log' }).inject(page);

        function onSend() {
          if (!client || !client.isOpen()) {
            log('연결되어 있지 않습니다.');
            return;
          }
          var text = String(messageEditor.value || '');
          client.send('message', text);
          log('보냄 ' + text);
        }

        widget.body.empty();
        page.inject(widget.body);
        connect();
      }

      widget.addEvents({ onLoad: build, endEdit: connect });
    });
  //]]>
  </script>
</head>
<body>
  <p>Loading...</p>
</body>
</html>
