<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:widget="http://www.netvibes.com/ns/">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>3DPlay Sample</title>
  <meta name="author" content="sample" />
  <meta name="description" content="3DPlay sample: show a 3DSpace object (physicalid) as a 3D / 2D preview inside the widget, open it in the 3DPlay app" />
  <meta name="autoRefresh" content="0" />

  <link rel="stylesheet" type="text/css" href="../c/UWA/assets/css/standalone.css" />
  <link rel="stylesheet" type="text/css" href="../Core/wux.css" />
  <script type="text/javascript" src="../AmdLoader/AmdLoader.js"></script>
  <script type="text/javascript" src="../c/UWA/js/UWA_Standalone_Alone.js"></script>

  <style type="text/css">
    .tp-page { padding: 12px; font-family: sans-serif; font-size: 13px; }
    .tp-row { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
    .tp-row label { width: 110px; color: #555; }
    .tp-viewer { position: relative; height: 420px; margin: 8px 0; border: 1px solid #d1d4d4; background: #f4f5f6; }
    .tp-log { height: 120px; overflow: auto; border: 1px solid #d1d4d4; padding: 6px; font: 12px monospace; background: #fafafa; }
  </style>

  <script type="text/javascript">
  //<![CDATA[
    require([
      'UWA/Core',
      'DS/3DPlayHelper/3DPlayHelper',
      'DS/i3DXCompassPlatformServices/i3DXCompassPlatformServices',
      'DS/WebappsUtils/WebappsUtils',
      'DS/TransientWidget/TransientWidget',
      'DS/Controls/Button',
      'DS/Controls/LineEditor'
    ], function (UWA, Player3DPlayWeb, CompassServices, WebappsUtils, TransientWidget, Button, LineEditor) {
      'use strict';

      let logEl;
      let spaceUrlPromise = null;

      function log(text) {
        logEl.textContent = new Date().toLocaleTimeString() + '  ' + text + '\n' + logEl.textContent;
      }

      function row(parent, labelText) {
        const el = UWA.createElement('div', { 'class': 'tp-row' }).inject(parent);
        if (labelText) { UWA.createElement('label', { text: labelText }).inject(el); }
        return el;
      }

      /*
       * [1] 3DSpace 주소: Compass 에 묻고, 답이 없으면 webapps 주소에서 계산합니다 (3DSpace 주소와 SecurityContext 문서와 같은 방식).
       */
      // #region space-url
      function getSpaceUrl() {
        if (spaceUrlPromise) {
          return spaceUrlPromise;
        }
        const fallback = WebappsUtils.getWebappsBaseUrl().replace(/webapps\/?$/, '');
        spaceUrlPromise = new Promise(function (resolve) {
          let done = false;
          function finish(url) {
            if (!done) {
              done = true;
              resolve(String(url).replace(/\/$/, ''));
            }
          }
          setTimeout(function () { finish(fallback); }, 5000);
          CompassServices.getServiceUrl({
            serviceName: '3DSpace',
            platformId: widget.getValue('x3dPlatformId') || undefined,
            onComplete: function (result) {
              const url = Array.isArray(result) ? (result[0] && result[0].url) : result;
              finish(url || fallback);
            },
            onFailure: function () { finish(fallback); }
          });
        });
        return spaceUrlPromise;
      }
      // #endregion space-url

      /*
       * [2] 3DSpace 객체를 3DPlay 입력(asset)으로 만들기
       *   - provider 'EV6' 는 3DSpace 객체입니다. physicalid, serverurl 이 문자열이 아니면 BadUrl 오류가 납니다.
       *   - dtype(타입 이름)으로 열 화면(3D / 도면 / 문서)을 고릅니다. 없으면 3D 로 봅니다.
       *   - requiredAuth, requestsOptions 는 OOTB(EditPropWidget, SNResultUX) 와 같은 값입니다.
       */
      // #region asset
      function buildAsset(spaceUrl, physicalId, type, securityContext) {
        const asset = {
          provider: 'EV6',
          serverurl: spaceUrl,
          physicalid: physicalId,
          dtype: type,
          tenant: widget.getValue('x3dPlatformId'),
          requiredAuth: 'passport',
          requestsOptions: { authentication: 'passport' }
        };
        if (securityContext) {
          asset.contextId = securityContext;
        }
        return asset;
      }
      // #endregion asset

      /*
       * [3] 미리 보기 만들기와 닫기 (EditPropWidget 3DPlayFacet 과 같은 순서: 이전 것 dispose → 비우기 → new)
       *   - usage 'preview' 는 가벼운 미리 보기 화면, loading 'autoplay' 는 스플래시를 누르지 않고 바로 불러옵니다.
       *   - callbacks 의 묶음 / 이름은 대소문자를 가리지 않습니다.
       *   - 돌려받은 객체는 바로 오지만 화면(experience)은 ExperienceReady 뒤에 준비됩니다.
       */
      // #region create
      function showPreview(state, container, asset) {
        closePreview(state, container);
        state.player = new Player3DPlayWeb({
          container: container,
          input: { asset: asset, usage: 'preview' },
          options: {
            loading: 'autoplay',
            callbacks: {
              experience: {
                ExperienceReady: function () { log('ExperienceReady'); },
                Error: function () { log('experience Error'); }
              },
              asset: {
                LoadingFinished: function (data) { log('LoadingFinished ' + data.time + ' ms'); },
                LoadingError: function () { log('asset LoadingError'); }
              }
            }
          }
        });
      }

      function closePreview(state, container) {
        if (state.player) {
          state.player.dispose();
          state.player = null;
        }
        container.empty();
      }
      // #endregion create

      /*
       * [4] 3DPlay 앱으로 열기: TransientWidget 으로 3DPlay 앱(X3DPLAW_AP)을 열고 X3DContentId 에 3DXContent 를 문자열로 넘깁니다.
       *   - DMUPlayMarker, CAT3DAnnotationUtils 와 같은 방식입니다 (version '0.1' 도 OOTB 값).
       *   - 3DPlay 앱은 widget.getValue('X3DContentId') 를 읽어 data.items 의 객체를 엽니다.
       */
      // #region transient
      function openIn3DPlayApp(physicalId, type, securityContext) {
        const content = {
          protocol: '3DXContent',
          version: '0.1',
          source: widget.getValue('appId') || '',
          data: {
            items: [{
              envId: widget.getValue('x3dPlatformId'),
              serviceId: '3DSpace',
              objectId: physicalId,
              objectType: type,
              contextId: securityContext || ''
            }]
          }
        };
        TransientWidget.showWidget('X3DPLAW_AP', '', { X3DContentId: JSON.stringify(content) });
      }
      // #endregion transient

      function build() {
        const state = { player: null };
        const page = UWA.createElement('div', { 'class': 'tp-page' });

        const idEditor = new LineEditor({ placeholder: 'physicalid (32자리 16진수)', sizeInCharNumber: 36 });
        idEditor.inject(row(page, 'physicalid'));
        const typeEditor = new LineEditor({ value: 'VPMReference', sizeInCharNumber: 24 });
        typeEditor.inject(row(page, '타입 (dtype)'));
        const ctxEditor = new LineEditor({ placeholder: 'ctx::역할.조직.협업공간 (비워도 됨)', sizeInCharNumber: 36 });
        ctxEditor.inject(row(page, 'SecurityContext'));

        const actions = row(page);
        new Button({ label: '미리 보기', emphasize: 'primary', onClick: onShow }).inject(actions);
        new Button({ label: '닫기', onClick: onClose }).inject(actions);
        new Button({ label: '3DPlay 앱으로 열기', onClick: onOpenApp }).inject(actions);

        const viewer = UWA.createElement('div', { 'class': 'tp-viewer' }).inject(page);
        logEl = UWA.createElement('div', { 'class': 'tp-log' }).inject(page);

        function readInput() {
          const physicalId = String(idEditor.value || '').trim();
          if (!physicalId) {
            log('physicalid 를 넣습니다.');
            return null;
          }
          return {
            physicalId: physicalId,
            type: String(typeEditor.value || '').trim(),
            securityContext: String(ctxEditor.value || '').trim()
          };
        }

        function onShow() {
          const input = readInput();
          if (!input) { return; }
          getSpaceUrl().then(function (spaceUrl) {
            log('3DSpace ' + spaceUrl + ' / ' + input.physicalId + ' (' + input.type + ')');
            showPreview(state, viewer, buildAsset(spaceUrl, input.physicalId, input.type, input.securityContext));
          });
        }

        function onClose() {
          closePreview(state, viewer);
          log('dispose');
        }

        function onOpenApp() {
          const input = readInput();
          if (!input) { return; }
          openIn3DPlayApp(input.physicalId, input.type, input.securityContext);
          log('showWidget X3DPLAW_AP');
        }

        widget.body.empty();
        page.inject(widget.body);
      }

      widget.addEvents({ onLoad: build });
    });
  //]]>
  </script>
</head>
<body>
  <p>Loading...</p>
</body>
</html>
