<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>18. 콤보를 열 때 행별 목록 불러오기</title>
  <link rel="stylesheet" type="text/css" href="../Core/wux.css" />
  <script type="text/javascript" src="../AmdLoader/AmdLoader.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    .page { display: flex; flex-direction: column; height: 100%; padding: 12px; box-sizing: border-box; }
    .page h2 { margin: 0 0 8px; font-size: 16px; }
    .page p { margin: 0 0 8px; font-size: 12px; color: #555; }
    #grid { position: relative; flex: 1; min-height: 200px; border: 1px solid #d1d4d4; }
  </style>
</head>
<body>
  <div class="page">
    <h2>18. 콤보를 열 때 행별 목록 불러오기 (show 이벤트 + getCellSemantics)</h2>
    <p>
      옵션 칸의 콤보를 열면 그 행의 목록을 API 로 받아 채웁니다. 한 번 받은 행은 다시 부르지 않습니다.
      <a href="index.html">목록으로</a>
    </p>
    <div id="grid"></div>
  </div>

  <script type="text/javascript">
    require([
      'DS/DataGridView/DataGridView',
      'DS/TreeModel/TreeDocument',
      'DS/TreeModel/TreeNodeModel',
      'DS/lodash-4.18.1/lodash'
    ], function (DataGridView, TreeDocument, TreeNodeModel, _) {
      'use strict';

      const requestOptions = (id) => new Promise((resolve) => {
        setTimeout(() => resolve([`${id}-A`, `${id}-B`, `${id}-C`]), 300);
      });

      const optionsById = {};
      const getRow = (cellInfos) => _.get(cellInfos, 'nodeModel.options.grid', {});

      const treeDocument = new TreeDocument();
      [
        { id: 'P-001', name: '브라켓' },
        { id: 'P-002', name: '샤프트', option: 'P-002-B' },
        { id: 'P-003', name: '커넥터' }
      ].forEach((row) => treeDocument.addRoot(new TreeNodeModel({ label: row.name, grid: { option: undefined, ...row } })));

      // #region columns
      const grid = new DataGridView({
        treeDocument: treeDocument,
        columns: [
          { text: '번호', dataIndex: 'id', width: 100 },
          { text: '이름', dataIndex: 'name', width: 120 },
          {
            text: '옵션',
            dataIndex: 'option',
            width: 200,
            typeRepresentation: 'customEnumMember',
            editableFlag: true,
            editionPolicy: 'EditionOnClick',
            getCellSemantics: (cellInfos) => {
              const row = getRow(cellInfos);
              return { possibleValues: optionsById[row.id] || _.compact([row.option]) };
            }
          }
        ]
      });
      grid.inject(document.getElementById('grid'));
      // #endregion columns

      // #region show
      grid.addEventListener('show', async (e, cellInfos) => {
        const id = getRow(cellInfos).id;
        if (!id || optionsById[id] || grid.layout.getDataIndexFromColumnIndex(cellInfos.columnID) !== 'option') return;
        optionsById[id] = await requestOptions(id);
        grid.updateCellView(cellInfos.cellID, { updateCellContent: true });
      });
      // #endregion show

      window.sample = { grid: grid, treeDocument: treeDocument };
    });
  </script>
</body>
</html>
