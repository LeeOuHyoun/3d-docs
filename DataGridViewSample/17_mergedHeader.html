<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>17. 2단 헤더와 병합 헤더</title>
  <link rel="stylesheet" type="text/css" href="../Core/wux.css" />
  <script type="text/javascript" src="../AmdLoader/AmdLoader.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    .page { display: flex; flex-direction: column; height: 100%; padding: 12px; box-sizing: border-box; }
    .page h2 { margin: 0 0 8px; font-size: 16px; }
    .page p { margin: 0 0 8px; font-size: 12px; color: #555; }
    #grid { position: relative; flex: 1; min-height: 200px; border: 1px solid #d1d4d4; }
  </style>
</head>
<body>
  <div class="page">
    <h2>17. 2단 헤더와 병합 헤더 (children)</h2>
    <p>
      SQCI, G-MES (EC적용), G-MES (출하검사) 는 아래 줄 컬럼 수만큼 가로로 병합됩니다. 세로 병합은 지원하지 않아서 단독 컬럼은 같은 이름의 그룹으로 감싸 1행에 이름을 두고 2행은 비웁니다.
      <a href="index.html">목록으로</a>
    </p>
    <div id="grid"></div>
  </div>

  <script type="text/javascript">
    require([
      'DS/DataGridView/DataGridView',
      'DS/TreeModel/TreeDocument',
      'DS/TreeModel/TreeNodeModel'
    ], function (DataGridView, TreeDocument, TreeNodeModel) {
      'use strict';

      // #region columns
      function single(text, dataIndex, width) {
        return { text: text, dataIndex: dataIndex + 'Group', children: [{ text: '', dataIndex: dataIndex, width: width }] };
      }

      const columns = [
        single('No', 'no', 50),
        single('Source', 'source', 90),
        single('Part Code', 'partCode', 120),
        single('Part Name', 'partName', 140),
        single('Part Spec', 'partSpec', 140),
        single('SOP', 'sop', 100),
        single('적용모델', 'model', 100),
        single('업체', 'vendor', 100),
        {
          text: 'SQCI',
          dataIndex: 'sqciGroup',
          children: [
            { text: '변경초물 입고상태', dataIndex: 'sqciStatus', width: 130 }
          ]
        },
        {
          text: 'G-MES (EC적용)',
          dataIndex: 'ecGroup',
          children: [
            { text: '완료상태', dataIndex: 'ecStatus', width: 90 },
            { text: '시작S/N (IMEI)', dataIndex: 'ecStartSn', width: 140 },
            { text: '종료S/N (IMEI)', dataIndex: 'ecEndSn', width: 140 },
            { text: '최종수정자', dataIndex: 'ecModifier', width: 100 }
          ]
        },
        {
          text: 'G-MES (출하검사)',
          dataIndex: 'shipGroup',
          children: [
            { text: 'PASS여부', dataIndex: 'shipPass', width: 90 },
            { text: '검사자', dataIndex: 'shipInspector', width: 100 }
          ]
        },
        single('Remark', 'remark', 160)
      ];
      // #endregion columns

      // #region data
      const treeDocument = new TreeDocument();
      treeDocument.prepareUpdate();
      treeDocument.addRoot(new TreeNodeModel({
        label: '1',
        grid: {
          no: 1,
          source: 'NEW',
          partCode: 'PART-0001',
          partName: '브라켓 ASSY',
          partSpec: 'SUS304 t0.5',
          sop: '2026-12-01',
          model: 'MODEL-A',
          vendor: '협력사 A',
          sqciStatus: '입고완료',
          ecStatus: '완료',
          ecStartSn: '350000000000001',
          ecEndSn: '350000000000100',
          ecModifier: 'user01',
          shipPass: 'PASS',
          shipInspector: 'inspector01',
          remark: ''
        }
      }));
      treeDocument.pushUpdate();
      // #endregion data

      // #region grid
      const grid = new DataGridView({
        treeDocument: treeDocument,
        columnSelection: 'none',
        layoutOptions: { columnHeaderHeight: 27 },
        columns: columns
      });
      grid.inject(document.getElementById('grid'));
      // #endregion grid

      window.sample = { grid: grid, treeDocument: treeDocument };
    });
  </script>
</body>
</html>
