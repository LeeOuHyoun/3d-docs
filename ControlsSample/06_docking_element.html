<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>06. 분할 레이아웃 (DockingElement)</title>
  <link rel="stylesheet" type="text/css" href="../Core/wux.css" />
  <script type="text/javascript" src="../AmdLoader/AmdLoader.js"></script>
  <style>
    html, body { margin: 0; font-family: sans-serif; }
    .page { padding: 12px; }
    .page h2 { margin: 0 0 8px; font-size: 16px; }
    .page h3 { margin: 16px 0 8px; font-size: 14px; }
    .page p { margin: 0 0 8px; font-size: 12px; color: #555; }
    .row { display: flex; gap: 6px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
    #layout { position: relative; height: 420px; border: 1px solid #d1d4d4; }
    .pane { padding: 8px; font-size: 12px; box-sizing: border-box; height: 100%; overflow: auto; }
    .pane li { cursor: pointer; padding: 2px 0; }
    .center { position: relative; height: 100%; }
    #log { height: 180px; overflow: auto; border: 1px solid #d1d4d4; padding: 6px; font: 12px monospace; background: #fafafa; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="page">
    <h2>06. 분할 레이아웃 (DockingElement)</h2>
    <p>왼쪽 목록 | 가운데 그리드 | 오른쪽 속성 3단 화면을 DockingElement 두 개로 만듭니다 (OOTB Skeleton 과 같은 구성). <a href="index.html">목록으로</a></p>

    <div class="row" id="buttons"></div>
    <div id="layout"></div>

    <h3>로그</h3>
    <div id="log"></div>
  </div>

  <script type="text/javascript">
    require([
      'UWA/Core',
      'DS/Windows/DockingElement',
      'DS/Controls/Button',
      'DS/DataGridView/DataGridView',
      'DS/TreeModel/TreeDocument',
      'DS/TreeModel/TreeNodeModel'
    ], function (UWA, DockingElement, Button, DataGridView, TreeDocument, TreeNodeModel) {
      'use strict';

      var logEl = document.getElementById('log');

      function log(text) {
        logEl.textContent = new Date().toLocaleTimeString() + '  ' + text + '\n' + logEl.textContent;
      }

      function addButton(label, fn) {
        new Button({ label: label, onClick: fn }).inject(document.getElementById('buttons'));
      }

      var PARTS = {
        Mechanical: [
          { name: 'PRT-0001', title: '브라켓', owner: '김철수' },
          { name: 'PRT-0002', title: '샤프트', owner: '이영희' }
        ],
        Electrical: [
          { name: 'PRT-0101', title: '커넥터', owner: '박민수' },
          { name: 'PRT-0102', title: '하네스', owner: '최지훈' },
          { name: 'PRT-0103', title: '센서', owner: '김철수' }
        ]
      };

      /*
       * [1] 3단 레이아웃
       *   - DockingElement 하나는 "한쪽 영역(dockingZoneContent) + 나머지 영역(freeZoneContent)" 입니다. side 는 만들 때만 정합니다.
       *   - 왼쪽 DockingElement 의 나머지 영역에 오른쪽 DockingElement 를 넣으면 왼쪽 | 가운데 | 오른쪽 이 됩니다.
       *   - 담는 요소(#layout)에 높이와 position 을 줍니다.
       *   - identifier 를 주면 사용자가 접기 막대를 눌러 바꾼 접힘 상태가 localStorage 'wux-docking-element-left' 에 저장되고 다음에 복원됩니다.
       *   - autoExpandFlag: false 면 접힌 영역에 마우스를 올려도 저절로 펼쳐지지 않습니다.
       */
      // #region layout
      var leftPane = UWA.createElement('div', { 'class': 'pane' });
      var rightPane = UWA.createElement('div', { 'class': 'pane', text: '행을 고르면 속성이 보입니다.' });
      var center = UWA.createElement('div', { 'class': 'center' });

      var rightDocking = new DockingElement({
        side: WUXDockAreaEnum.RightDockArea,
        dockingZoneContent: rightPane,
        freeZoneContent: center,
        dockingZoneSize: 220,
        minSize: 160,
        maxSize: 400,
        collapsibleFlag: true,
        visibleCollapserFlag: true
      });

      var leftDocking = new DockingElement({
        identifier: 'sample-left-docking',
        side: WUXDockAreaEnum.LeftDockArea,
        dockingZoneContent: leftPane,
        freeZoneContent: rightDocking.getContent(),
        dockingZoneSize: 180,
        minSize: 120,
        maxSize: 320,
        collapsibleFlag: true,
        visibleCollapserFlag: true,
        autoExpandFlag: false
      });
      leftDocking.inject(document.getElementById('layout'));
      // #endregion layout

      /*
       * [2] 영역 이벤트
       *   - dockResize: 사용자가 경계를 끌어 크기를 바꾼 뒤, collapse / expand: 접힘 / 펼침
       */
      // #region events
      [['왼쪽', leftDocking], ['오른쪽', rightDocking]].forEach(function (pair) {
        ['dockStartResize', 'dockResize', 'collapse', 'expand'].forEach(function (name) {
          pair[1].addEventListener(name, function () {
            log(pair[0] + ' : ' + name + ' (dockingZoneSize ' + pair[1].dockingZoneSize + ', collapseDockingZoneFlag ' + pair[1].collapseDockingZoneFlag + ')');
          });
        });
      });
      // #endregion events

      var treeDocument = new TreeDocument();
      var grid = new DataGridView({
        treeDocument: treeDocument,
        rowSelection: 'single',
        columns: [
          { text: '품번', dataIndex: 'tree', width: 120 },
          { text: '품명', dataIndex: 'title', width: 140 },
          { text: '담당자', dataIndex: 'owner', width: 100 }
        ]
      });
      grid.inject(center);

      function showCategory(category) {
        treeDocument.prepareUpdate();
        treeDocument.empty();
        PARTS[category].forEach(function (row) {
          treeDocument.addRoot(new TreeNodeModel({ label: row.name, grid: row }));
        });
        treeDocument.pushUpdate();
        log('분류: ' + category);
      }

      var list = UWA.createElement('ul', { styles: { margin: 0, paddingLeft: '16px' } }).inject(leftPane);
      Object.keys(PARTS).forEach(function (category) {
        UWA.createElement('li', { text: category, events: { click: function () { showCategory(category); } } }).inject(list);
      });

      treeDocument.getXSO().onPostAdd(function () {
        var node = treeDocument.getSelectedNodes()[0];
        if (!node) { return; }
        rightPane.textContent = node.options.grid.name + ' / ' + node.options.grid.title + ' / ' + node.options.grid.owner;
      });

      showCategory('Mechanical');

      /*
       * [3] 코드로 바꾸기
       *   - collapseDockingZoneFlag 로 접고 펼치고, dockingZoneSize 로 너비를 바꿉니다.
       *   - visibleDockingZoneFlag: false 면 영역과 접기 막대를 모두 숨깁니다.
       */
      // #region control
      function toggleLeft() {
        leftDocking.collapseDockingZoneFlag = !leftDocking.collapseDockingZoneFlag;
      }

      function widenRight() {
        rightDocking.dockingZoneSize = rightDocking.dockingZoneSize + 40;
      }

      function toggleRightVisible() {
        rightDocking.visibleDockingZoneFlag = !rightDocking.visibleDockingZoneFlag;
      }
      // #endregion control

      addButton('왼쪽 접기 / 펼치기', toggleLeft);
      addButton('오른쪽 넓히기 (+40)', widenRight);
      addButton('오른쪽 숨기기 / 보이기', toggleRightVisible);
      addButton('크기 보기', function () {
        log('왼쪽 ' + leftPane.offsetWidth + 'px, 가운데 ' + center.offsetWidth + 'px, 오른쪽 ' + rightPane.offsetWidth + 'px');
      });
      addButton('저장 값 보기', function () {
        var saved = null;
        try { saved = localStorage.getItem('wux-docking-element-left'); } catch (e) { saved = null; }
        log('wux-docking-element-left: ' + saved);
      });
    });
  </script>
</body>
</html>
