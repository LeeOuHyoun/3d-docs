<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>04. 다이얼로그 안에 DataGridView</title>
  <link rel="stylesheet" type="text/css" href="../Core/wux.css" />
  <script type="text/javascript" src="../AmdLoader/AmdLoader.js"></script>
  <style>
    html, body { margin: 0; font-family: sans-serif; }
    .page { padding: 12px; }
    .page h2 { margin: 0 0 8px; font-size: 16px; }
    .page h3 { margin: 16px 0 8px; font-size: 14px; }
    .page p { margin: 0 0 8px; font-size: 12px; color: #555; }
    .row { display: flex; gap: 6px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
    .dlg-grid-body { position: relative; height: 100%; }
    .dlg-grid-body .grid-area { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
    .dlg-grid-body.with-filter .grid-area { top: 40px; }
    .dlg-grid-body .filter-area { position: absolute; top: 0; left: 0; right: 0; height: 32px; }
    #log { height: 200px; overflow: auto; border: 1px solid #d1d4d4; padding: 6px; font: 12px monospace; background: #fafafa; }
  </style>
</head>
<body>
  <div class="page">
    <h2>04. 다이얼로그 안에 DataGridView</h2>
    <p>Dialog 의 content 에 DataGridView 를 넣고, 고른 행을 돌려받습니다. <a href="index.html">목록으로</a></p>

    <div class="row" id="buttons"></div>

    <h3>로그</h3>
    <div id="log"></div>
  </div>

  <script type="text/javascript">
    require([
      'UWA/Core',
      'DS/Windows/Dialog',
      'DS/Windows/ImmersiveFrame',
      'DS/Controls/Button',
      'DS/Controls/LineEditor',
      'DS/DataGridView/DataGridView',
      'DS/TreeModel/TreeDocument',
      'DS/TreeModel/TreeNodeModel'
    ], function (UWA, Dialog, ImmersiveFrame, Button, LineEditor, DataGridView, TreeDocument, TreeNodeModel) {
      'use strict';

      const logEl = document.getElementById('log');

      function log(text) {
        logEl.textContent = new Date().toLocaleTimeString() + '  ' + text + '\n' + logEl.textContent;
      }

      function addButton(label, fn) {
        new Button({ label: label, onClick: fn }).inject(document.getElementById('buttons'));
      }

      const PARTS = [
        { id: 'p1', name: 'PRT-0001', title: '브라켓', state: 'IN_WORK', owner: '김철수' },
        { id: 'p2', name: 'PRT-0002', title: '샤프트', state: 'FROZEN', owner: '이영희' },
        { id: 'p3', name: 'PRT-0003', title: '하우징', state: 'RELEASED', owner: '박민수' },
        { id: 'p4', name: 'PRT-0004', title: '커버', state: 'IN_WORK', owner: '김철수' },
        { id: 'p5', name: 'PRT-0005', title: '베어링', state: 'RELEASED', owner: '최지훈' },
        { id: 'p6', name: 'PRT-0006', title: '볼트', state: 'IN_WORK', owner: '이영희' }
      ];

      /*
       * [공통] 위젯에 ImmersiveFrame 을 하나만 만들어 모든 다이얼로그가 같이 씁니다.
       */
      const frame = new ImmersiveFrame();
      frame.inject(document.body);

      /*
       * [1] 고르기 다이얼로그
       *   - Dialog 에 height 를 주어야 내용 영역 높이가 정해집니다 (-1 이면 auto 라서 그리드 높이가 0).
       *   - 내용 요소는 position: relative, height: 100%. 그리드는 그 안에 inject 합니다.
       *   - 행이 선택될 때마다 Ok 버튼의 disabled 를 바꿉니다.
       *   - 닫힐 때 grid.destroy() 로 그리드를 정리합니다.
       */
      // #region pick
      function openPickDialog(rows, onPicked) {
        const treeDocument = new TreeDocument();
        treeDocument.prepareUpdate();
        rows.forEach(function (row) {
          treeDocument.addRoot(new TreeNodeModel({
            label: row.name,
            grid: { id: row.id, title: row.title, state: row.state, owner: row.owner }
          }));
        });
        treeDocument.pushUpdate();

        const body = UWA.createElement('div', { 'class': 'dlg-grid-body' });
        const gridArea = UWA.createElement('div', { 'class': 'grid-area' }).inject(body);

        const grid = new DataGridView({
          treeDocument: treeDocument,
          rowSelection: 'multiple',
          cellSelection: 'none',
          columns: [
            { text: '품번', dataIndex: 'tree', width: 140 },
            { text: '품명', dataIndex: 'title', width: 160 },
            { text: '상태', dataIndex: 'state', width: 110 },
            { text: '담당자', dataIndex: 'owner', width: 110 }
          ]
        });
        grid.inject(gridArea);

        const okButton = new Button({
          label: '선택',
          disabled: true,
          onClick: function (e) {
            const picked = treeDocument.getSelectedNodes().map(function (node) { return node.options.grid; });
            e.dsModel.dialog.close();
            onPicked(picked);
          }
        });

        function updateOkButton() {
          okButton.disabled = treeDocument.getSelectedNodes().length === 0;
        }
        treeDocument.getXSO().onPostAdd(updateOkButton);
        treeDocument.getXSO().onPostRemove(updateOkButton);

        const dialog = new Dialog({
          title: '부품 선택',
          content: body,
          immersiveFrame: frame,
          modalFlag: true,
          width: 600,
          height: 400,
          minWidth: 400,
          minHeight: 300,
          resizableFlag: true,
          buttons: {
            Ok: okButton,
            Cancel: new Button({ onClick: function (e) { e.dsModel.dialog.close(); } })
          }
        });

        dialog.addEventListener('close', function () {
          grid.destroy();
        });

        return dialog;
      }
      // #endregion pick

      addButton('부품 고르기', function () {
        openPickDialog(PARTS, function (picked) {
          log('선택: ' + picked.map(function (p) { return p.id + ' ' + p.title; }).join(', '));
        });
      });

      /*
       * [2] 위에 찾기 칸을 둔 다이얼로그
       *   - 찾기 칸은 위쪽에 높이를 정해 두고, 그리드 영역은 top 으로 그만큼 내립니다 (OOTB 는 top: 40px).
       *   - 찾는 글자가 바뀌면 TreeDocument 를 다시 채웁니다.
       */
      // #region filter
      function openFilterDialog(rows) {
        const treeDocument = new TreeDocument();

        function fill(text) {
          treeDocument.prepareUpdate();
          treeDocument.empty();
          rows.filter(function (row) {
            return !text || (row.name + ' ' + row.title + ' ' + row.owner).indexOf(text) >= 0;
          }).forEach(function (row) {
            treeDocument.addRoot(new TreeNodeModel({ label: row.name, grid: row }));
          });
          treeDocument.pushUpdate();
        }
        fill('');

        const body = UWA.createElement('div', { 'class': 'dlg-grid-body with-filter' });
        const filterArea = UWA.createElement('div', { 'class': 'filter-area' }).inject(body);
        const gridArea = UWA.createElement('div', { 'class': 'grid-area' }).inject(body);

        const finder = new LineEditor({ placeholder: '품번, 품명, 담당자' });
        finder.inject(filterArea);
        finder.addEventListener('uncommittedChange', function (e) { fill(e.options.uncommittedValue || ''); });
        finder.addEventListener('change', function () { fill(finder.value || ''); });

        const grid = new DataGridView({
          treeDocument: treeDocument,
          columns: [
            { text: '품번', dataIndex: 'tree', width: 140 },
            { text: '품명', dataIndex: 'title', width: 160 },
            { text: '담당자', dataIndex: 'owner', width: 110 }
          ]
        });
        grid.inject(gridArea);

        const dialog = new Dialog({
          title: '부품 찾기',
          content: body,
          immersiveFrame: frame,
          modalFlag: true,
          width: 520,
          height: 420,
          resizableFlag: true,
          buttons: { Close: new Button({ onClick: function (e) { e.dsModel.dialog.close(); } }) }
        });
        dialog.addEventListener('close', function () { grid.destroy(); });
      }
      // #endregion filter

      addButton('찾기 칸 + 그리드', function () { openFilterDialog(PARTS); });
    });
  </script>
</body>
</html>
