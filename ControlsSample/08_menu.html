<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>08. 메뉴 (DS/Menu)</title>
  <link rel="stylesheet" type="text/css" href="../Core/wux.css" />
  <script type="text/javascript" src="../AmdLoader/AmdLoader.js"></script>
  <style>
    html, body { margin: 0; font-family: sans-serif; }
    .page { padding: 12px; }
    .page h2 { margin: 0 0 8px; font-size: 16px; }
    .page h3 { margin: 16px 0 8px; font-size: 14px; }
    .page p { margin: 0 0 8px; font-size: 12px; color: #555; }
    .row { display: flex; gap: 6px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
    #area { height: 130px; border: 1px dashed #b4b6ba; padding: 8px; font-size: 12px; box-sizing: border-box; }
    #inner { margin-top: 8px; width: 260px; height: 60px; border: 1px solid #368ec4; padding: 6px; box-sizing: border-box; }
    [is-displaying-menu] { background: #e5f1f9; }
    #log { height: 220px; overflow: auto; border: 1px solid #d1d4d4; padding: 6px; font: 12px monospace; background: #fafafa; white-space: pre; }
  </style>
</head>
<body>
  <div class="page">
    <h2>08. 메뉴 (DS/Menu)</h2>
    <p>버튼 아래 메뉴, 체크 / 라디오 항목, 하위 메뉴, 열어 둔 채 체크 바꾸기, 오른쪽 클릭 메뉴(ContextualMenu)를 보여 줍니다. <a href="index.html">목록으로</a></p>

    <div class="row" id="buttons"></div>

    <h3>오른쪽 클릭 영역</h3>
    <div id="area">바깥 영역 (오른쪽 클릭)
      <div id="inner">PRT-0002 (오른쪽 클릭하면 항목이 더 붙음)</div>
    </div>

    <h3>로그</h3>
    <div id="log"></div>
  </div>

  <script type="text/javascript">
    require([
      'DS/Menu/Menu',
      'DS/Menu/ContextualMenu',
      'DS/Controls/Button'
    ], function (Menu, ContextualMenu, Button) {
      'use strict';

      var logEl = document.getElementById('log');

      function log(text) {
        logEl.textContent = new Date().toLocaleTimeString() + '  ' + text + '\n' + logEl.textContent;
      }

      function addButton(label, fn) {
        new Button({ label: label, onClick: fn }).inject(document.getElementById('buttons'));
      }

      /*
       * [1] 버튼 아래에 메뉴 열기
       *   - Menu 는 인스턴스를 만들지 않고 Menu.show(항목 배열, 설정, 콜백) 으로 엽니다. 한 번에 하나만 열립니다.
       *   - position 은 메뉴 왼쪽 위 모서리 좌표(px)입니다. 기준 요소 옵션은 없어서 getBoundingClientRect() 로 계산합니다.
       *   - layout: 'topright' 면 메뉴 오른쪽 위 모서리를 position 에 맞춥니다 (오른쪽 정렬).
       *   - onHide 의 인자는 항목을 눌러 닫혔을 때만 true 입니다.
       */
      // #region show
      function buttonRect(e) {
        return e.dsModel.getContent().getBoundingClientRect();
      }

      function showMenu(items, config) {
        Menu.show(items, config, {
          onShow: function () { log('onShow'); },
          onHide: function (byAction) { log('onHide (항목을 눌러 닫힘: ' + (byAction === true) + ')'); }
        });
      }

      function openBasic(e) {
        var rect = buttonRect(e);
        showMenu(basicItems(), { position: { x: rect.left, y: rect.bottom } });
      }

      function openRightAligned(e) {
        var rect = buttonRect(e);
        showMenu(basicItems(), { position: { x: rect.right, y: rect.bottom }, layout: 'topright' });
      }
      // #endregion show

      /*
       * [2] 항목 종류
       *   - type 은 꼭 넣습니다. icon 과 fonticon 은 같이 넣을 수 없습니다.
       *   - state: 'disabled' 면 흐리게 보이고 누를 수 없습니다. tooltip 은 문자열 또는 툴팁 옵션 객체입니다.
       *   - accelerator 는 오른쪽에 보이는 글자일 뿐 단축키를 등록하지 않습니다.
       *   - action.callback 은 { context } 를 받습니다. action.context 에 넣은 값이 그대로 옵니다.
       */
      // #region items
      function run(e) {
        log('실행: ' + e.context);
      }

      function basicItems() {
        return [
          { type: 'TitleItem', title: 'PRT-0001 브라켓' },
          { type: 'PushItem', title: '열기', fonticon: { content: 'wux-ui-3ds wux-ui-3ds-open' }, accelerator: 'Enter', action: { callback: run, context: 'open' } },
          { type: 'PushItem', title: '복사', icon: { iconName: 'copy', fontIconFamily: WUXManagedFontIcons.Font3DS }, accelerator: 'Ctrl+C', action: { callback: run, context: 'copy' } },
          { type: 'PushItem', title: '잠금', fonticon: { content: 'wux-ui-3ds wux-ui-3ds-lock' }, state: 'disabled', tooltip: '권한이 없습니다' },
          { type: 'SeparatorItem' },
          { type: 'PushItem', title: '삭제', fonticon: { content: 'wux-ui-3ds wux-ui-3ds-trash' }, action: { callback: run, context: 'delete' } }
        ];
      }
      // #endregion items

      /*
       * [3] 체크, 라디오 항목
       *   - 눌러도 Menu 가 state 를 바꾸지 않습니다. 앱이 값을 갖고 있다가 메뉴를 열 때마다 항목을 새로 만듭니다.
       *   - RadioItem 도 묶음 개념이 없어서 하나만 'selected' 가 되게 앱이 정합니다.
       */
      // #region check
      var view = { thumbnail: true, sort: 'name' };

      function sortItem(value, title) {
        return {
          type: 'RadioItem',
          title: title,
          state: view.sort === value ? 'selected' : 'unselected',
          action: { callback: function () { view.sort = value; log('정렬: ' + value); } }
        };
      }

      function viewItems() {
        return [
          {
            type: 'CheckItem',
            title: '썸네일 보기',
            state: view.thumbnail ? 'selected' : 'unselected',
            action: { callback: function () { view.thumbnail = !view.thumbnail; log('썸네일: ' + view.thumbnail); } }
          },
          { type: 'SeparatorItem' },
          { type: 'TitleItem', title: '정렬' },
          sortItem('name', '이름순'),
          sortItem('date', '수정일순')
        ];
      }
      // #endregion check

      /*
       * [4] 하위 메뉴
       *   - submenu 에 항목 배열을 주면 마우스를 올릴 때 옆에 열립니다.
       *   - 열 때 항목을 가져오려면 submenu 에 async function 을 줍니다 (Promise 를 돌려주는 보통 함수는 안 됨).
       *   - action 과 submenu 를 같이 주면 글자 부분은 실행, 오른쪽 화살표 부분은 하위 메뉴가 됩니다.
       */
      // #region submenu
      function exportItems() {
        return [
          {
            type: 'PushItem',
            title: '내보내기',
            fonticon: { content: 'wux-ui-3ds wux-ui-3ds-export' },
            submenu: [
              { type: 'PushItem', title: 'CSV', action: { callback: run, context: 'csv' } },
              { type: 'PushItem', title: 'Excel', action: { callback: run, context: 'xlsx' } }
            ]
          },
          {
            type: 'PushItem',
            title: '최근 문서',
            submenu: async function () {
              await new Promise(function (resolve) { setTimeout(resolve, 300); });
              return ['DOC-0001', 'DOC-0002'].map(function (name) {
                return { type: 'PushItem', title: name, action: { callback: run, context: name } };
              });
            }
          },
          {
            type: 'PushItem',
            title: '공유',
            action: { callback: run, context: 'share' },
            submenu: [
              { type: 'PushItem', title: '링크 복사', action: { callback: run, context: 'share-link' } },
              { type: 'PushItem', title: '메일로 보내기', action: { callback: run, context: 'share-mail' } }
            ]
          }
        ];
      }
      // #endregion submenu

      /*
       * [5] 열어 둔 채 체크 바꾸기
       *   - doNotHideOnAction: true 면 항목을 눌러도 메뉴가 닫히지 않습니다.
       *   - 열린 메뉴의 체크 표시는 Menu.updateModel([{ title, state }]) 로 바꿉니다 (CheckItem 만, title 로 찾음).
       */
      // #region keepOpen
      var columns = [
        { title: '품번', visible: true },
        { title: '품명', visible: true },
        { title: '담당자', visible: false }
      ];

      function columnItems() {
        return columns.map(function (column) {
          return {
            type: 'CheckItem',
            title: column.title,
            state: column.visible ? 'selected' : 'unselected',
            action: {
              callback: function () {
                column.visible = !column.visible;
                Menu.updateModel([{ title: column.title, state: column.visible ? 'selected' : 'unselected' }]);
                log('컬럼 ' + column.title + ': ' + column.visible);
              }
            }
          };
        });
      }

      function openColumns(e) {
        var rect = buttonRect(e);
        showMenu(columnItems(), { position: { x: rect.left, y: rect.bottom }, doNotHideOnAction: true });
      }
      // #endregion keepOpen

      addButton('기본 메뉴', openBasic);
      addButton('오른쪽 정렬 (layout)', openRightAligned);
      addButton('체크 / 라디오', function (e) {
        var rect = buttonRect(e);
        showMenu(viewItems(), { position: { x: rect.left, y: rect.bottom } });
      });
      addButton('하위 메뉴', function (e) {
        var rect = buttonRect(e);
        showMenu(exportItems(), { position: { x: rect.left, y: rect.bottom } });
      });
      addButton('열어 둔 채 바꾸기', openColumns);

      /*
       * [6] 오른쪽 클릭 메뉴 (ContextualMenu)
       *   - 요소에 callback 을 등록하면 그 요소 안을 오른쪽 클릭(터치는 길게 누르기)할 때 callback 이 돌려준 항목으로 메뉴가 열립니다.
       *   - callback 은 배열 또는 Promise 를 돌려줍니다. 빈 배열이면 메뉴가 열리지 않습니다.
       *   - 부모와 자식 요소에 따로 등록하면 callback 이 두 번 불리므로, 바깥 요소 한 곳에 등록하고 눌린 요소(params.info.target)로 항목을 나눕니다.
       *   - buildAndDisplayContextualMenu(요소, { clientX, clientY }) 는 오른쪽 클릭 없이 같은 메뉴를 엽니다.
       *   - addEventListener 가 돌려준 번호로 removeEventListener 합니다.
       */
      // #region contextual
      var area = document.getElementById('area');
      var inner = document.getElementById('inner');

      var areaToken = ContextualMenu.addEventListener(area, {
        context: 'PRT-0002',
        callback: function (params) {
          var onInner = !!params.info.target.closest('#inner');
          log('callback (눌린 요소: ' + params.info.target.id + ', 영역 안 위치: ' + Math.round(params.info.position.x) + ', ' + Math.round(params.info.position.y) + ')');
          var items = [{ type: 'PushItem', title: '새로 고침', fonticon: { content: 'wux-ui-3ds wux-ui-3ds-reload' }, action: { callback: run, context: 'reload' } }];
          if (onInner) {
            items.unshift({ type: 'PushItem', title: params.context + ' 열기', action: { callback: run, context: params.context } }, { type: 'SeparatorItem' });
          }
          return items;
        },
        onHideCB: function (byAction) {
          log('onHideCB (항목을 눌러 닫힘: ' + (byAction === true) + ')');
        }
      });

      function openByCode() {
        var rect = inner.getBoundingClientRect();
        ContextualMenu.buildAndDisplayContextualMenu(inner, { clientX: rect.left, clientY: rect.bottom });
      }

      function removeContextual() {
        if (areaToken === undefined) { return; }
        ContextualMenu.removeEventListener(area, areaToken);
        areaToken = undefined;
        log('오른쪽 클릭 메뉴 등록 해제');
      }
      // #endregion contextual

      addButton('코드로 열기', openByCode);
      addButton('등록 해제', removeContextual);
    });
  </script>
</body>
</html>
